<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player - RAINOUT</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body class="player-page">
  <!-- Site nav -->
  <header class="site-nav">
    <a class="brand" href="/"><img src="/assets/umbrella.png" alt="RAINOUT" /></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links">
      <a href="/" data-match="/">Home</a>
      <a href="/releases" data-match="/releases">Releases</a>
      <a href="/player" data-match="/player" class="active">Player</a>
      <a href="/about" data-match="/about">About Us</a>
    </nav>
  </header>

  <!-- Page content -->
  <main class="container">
    <h2>RAINOUT Player</h2>
    <div id="releaseList" class="ap-release-list">
      <!-- Releases will appear here -->
    </div>
  </main>

  <!-- Bottom mini-player (only ONE with this id) -->
  <div class="ap-nowbar" id="nowbar" hidden>
    <div class="ap-nowbar-inner">
      <img id="apCover" alt="" />
      <div class="ap-meta">
        <div id="apTitle" class="ap-title">—</div>
        <div id="apSub" class="ap-sub">—</div>
      </div>
      <div class="ap-controls">
        <button id="apRepeat" class="ap-btn" aria-pressed="false" title="Repeat">🔁</button>
        <button id="apPrev"   class="ap-btn" aria-label="Previous">⏮</button>
        <button id="apPlay"   class="ap-btn" aria-label="Play/Pause">►</button>
        <button id="apNext"   class="ap-btn" aria-label="Next">⏭</button>
        <button id="apShuffle" class="ap-btn" aria-pressed="false" title="Shuffle">🔀</button>
      </div>
      <div class="ap-progress">
        <span id="apCurrent">0:00</span>
        <input id="apSeek" type="range" min="0" max="1000" value="0" />
        <span id="apDuration">0:00</span>
      </div>
      <div class="ap-vol">
        <span>🔊</span>
        <input id="apVolume" type="range" min="0" max="1" step="0.01" value="0.9" />
      </div>
    </div>
    <audio id="apAudio" preload="metadata"></audio>
  </div>
  <script src="/script.js" defer></script>
  <!-- Load JS (fix these paths!) -->
  <!-- remove this next line if /script.js doesn't exist -->
  <!-- <script src="/script.js" defer></script> -->

  <!-- If the file lives at the site root -->
  <script src="/js/audio-player.js" defer></script>
  <!-- Or, if it's actually inside /js/, use this instead:
  <script src="/js/audio-player.js" defer></script>
  -->
  <div id="global-footer"></div>
</body>
</html>
