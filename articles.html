<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="The RAINOUT Times">
    <meta property="og:description" content="Latest articles, interviews, announcements, and editorials from RAINOUT.">
    <meta property="og:image" content="https://rainoutcollective.com/assets/rainoutbanner.png">
    <meta property="og:url" content="https://rainoutcollective.com">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The RAINOUT Times">
    <meta name="twitter:description" content="Latest articles, interviews, announcements, and editorials from RAINOUT.">
    <meta name="twitter:image" content="https://rainoutcollective.com/assets/rainoutbanner.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The RAINOUT Times</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="style.css">
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        .times-header { text-align: center; margin: 40px 0 60px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 40px; }
        .times-title { font-family: 'Courier New', monospace; font-size: 3.5rem; text-transform: uppercase; letter-spacing: 6px; color: #fff; margin: 0 0 10px 0; text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .times-subtitle { font-family: 'Courier New', monospace; color: var(--text-secondary); margin: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; }
        
        .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1000px; margin: 0 auto 60px auto; }
        .article-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; transition: transform 0.3s ease, background 0.3s ease; text-decoration: none; display: flex; flex-direction: column; border: 1px solid transparent; }
        .article-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        .article-card img { width: 100%; height: 200px; object-fit: cover; filter: grayscale(50%); transition: filter 0.3s ease; }
        .article-card:hover img { filter: grayscale(0%); }
        .article-card-content { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .article-card h3 { font-family: 'Courier New', monospace; color: #fff; font-size: 1.3rem; margin: 0 0 10px 0; line-height: 1.4; }
        .article-card .meta { color: var(--text-secondary); font-family: 'Courier New', monospace; font-size: 0.85rem; margin-bottom: 15px; text-transform: uppercase; }
        .article-card p { color: #ccc; font-size: 0.95rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="global-nav"></div>

    <main class="container">
        <header class="times-header">
            <h1 class="times-title">The RAINOUT Times</h1>
            <p class="times-subtitle">Interviews • Announcements • Editorials</p>
        </header>

        <!-- Dynamic Grid Container -->
        <div class="article-grid" id="articles-grid-container">
            <!-- Articles will load here automatically -->
        </div>
    </main>

    <div id="global-footer"></div>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/articles.json')
                .then(response => response.json())
                .then(articles => {
                    // Sort descending by date (newest first)
                    articles.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    const grid = document.getElementById('articles-grid-container');
                    grid.innerHTML = '';
                    
                    articles.forEach(art => {
                        grid.innerHTML += `
                            <a href="${art.url}" class="article-card">
                                <img src="${art.heroImg}" alt="${art.title}">
                                <div class="article-card-content">
                                    <h3>${art.title}</h3>
                                    <div class="meta">By ${art.author} • ${art.displayDate}</div>
                                    <p>${art.description}</p>
                                </div>
                            </a>
                        `;
                    });
                })
                .catch(err => console.error('Error loading articles:', err));
        });
    </script>
</body>
</html>
