<body>

          <a href="/player" data-match="/player">Player</a>
          <a href="/about" data-match="/about">About Us</a>
        </nav>
      </header>
    
    <div class="container">
        <main>
            
            <h1>ALL RELEASES</h1>
            <a href="/" class="back-button">← Back to Home</a>

              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="album">Albums/EPs</button>

    <script src="js/script.js"></script>
    <script src="js/fetchReleasesAll.js"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
          const rainContainer = document.getElementById("rain");
          const dropCount = 100; // You can change this for more/less rain
      
          for (let i = 0; i < dropCount; i++) {
            const drop = document.createElement("div");
            drop.classList.add("drop");
      
            // Random horizontal position
            drop.style.left = `${Math.random() * 100}vw`;
      
            // Random height
            drop.style.height = `${Math.random() * 20 + 10}px`;
      
            // Random animation duration
            drop.style.animationDuration = `${Math.random() * 2 + 2}s`;
      
            // Random animation delay
            drop.style.animationDelay = `${Math.random() * 5}s`;
      
            rainContainer.appendChild(drop);
          }
        });
      </script>
</body>
</html>
