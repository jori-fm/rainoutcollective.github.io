    <script src="/script.js" defer></script>
    <script>
        // Simple script for the nostalgic effect
        document.addEventListener('DOMContentLoaded', function() {
            // Add subtle flickering to releases on hover
            const releases = document.querySelectorAll('.release');
            releases.forEach(release => {
                release.addEventListener('mouseenter', () => {
                    release.style.animation = 'flicker 0.8s';
                });
                release.addEventListener('mouseleave', () => {
                    release.style.animation = 'none';
                });
            });
            
            // Add scanline effect to banner
            const banner = document.querySelector('.banner');
            setInterval(() => {
                banner.style.boxShadow = `0 0 ${15 + Math.random() * 10}px rgba(255, 80, 80, ${0.1 + Math.random() * 0.1})`;
            }, 3000);
        });
    </script>
    
<script>
    document.addEventListener('DOMContentLoaded', function() {
